[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ladder"
version = "0.1.7"
description = "6 RAG recipes, ladder-first: BM25 full-text, LLM query rewriting, hybrid retrieval on SQLite FTS5"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
docs = ["pypdf>=4", "python-docx>=1"]

[tool.setuptools]
py-modules = ["rag", "ragcli"]

[project.scripts]
rag-ladder = "ragcli:main"
