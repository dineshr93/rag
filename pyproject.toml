[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "rag.md recipes, ladder-first: BM25 full-text, LLM query rewriting, hybrid retrieval on SQLite FTS5"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools]
py-modules = ["rag"]

[project.scripts]
rag = "rag:main"
